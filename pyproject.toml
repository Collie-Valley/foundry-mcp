[project]
# El nombre de distribución NO es el del módulo (`foundry_mcp`): `foundry-mcp` está cogido en PyPI
# por un proyecto ajeno y vivo, así que el paquete se publica como `foundry-boards-mcp`, que además
# es como se llama el servidor en la configuración de todos los clientes.
name = "foundry-boards-mcp"
version = "0.2.0"
description = "MCP para administrar los tableros Kanban de Foundry desde agentes de IA."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Collie Valley" }]
keywords = ["mcp", "model-context-protocol", "kanban", "agile", "foundry", "claude", "agents"]
# Sin clasificador de licencia a propósito: con `license` ya en formato SPDX (PEP 639), repetirla
# como clasificador es un error de empaquetado, no un duplicado inofensivo.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Utilities",
]
dependencies = [
    # SDK oficial de Model Context Protocol. La 2.x es la que habla la revisión 2026-07-28 (sin
    # `initialize`, sin sesión) y sigue sirviendo a los clientes de revisiones anteriores; la 1.x
    # solo recibe mantenimiento (FNV-310). El techo en la 3.0 no es precaución: la 2.0 ya rompió
    # el import del servidor (`mcp.server.fastmcp` desapareció), y el `uv.lock` no viaja dentro
    # del paquete, así que sin techo quien lo instale desde PyPI resolvería la próxima mayor.
    "mcp>=2.3,<3",
    "httpx>=0.27",       # cliente HTTP async contra la API de Foundry
    "python-dotenv>=1.0", # carga del .env local (solo config, no credenciales)
    "keyring>=25",       # guarda el token en el gestor de credenciales del SO (opt-in)
]

# Desde la 0.1.1 el código vive en su propio repositorio público: quien llegue desde PyPI puede
# leerlo, abrir una incidencia o mandar un arreglo, no solo ir al producto.
[project.urls]
Homepage = "https://foundry.collie.digital"
Repository = "https://github.com/Collie-Valley/foundry-mcp"
Issues = "https://github.com/Collie-Valley/foundry-mcp/issues"

# Entry point: permite `uvx foundry-boards-mcp`, es decir, correr el MCP SIN clonar el repo (uv
# baja solo este paquete y lo ejecuta). El comando se llama igual que el paquete a propósito: si
# no coincidieran, instalarlo obligaría a explicar un `--from` en la primera línea de la guía.
[project.scripts]
foundry-boards-mcp = "foundry_mcp.server:main"

# Grupo de desarrollo (PEP 735): `uv run pytest -q` y `uv run mypy` funcionan sin `--with`.
[dependency-groups]
dev = ["pytest>=8", "mypy>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foundry_mcp"]

# La vara de estilo vive aquí, explícita: sin ella cada máquina mide con su propia configuración y
# la CI mediría otra cosa. Solo `ruff check`; el formateador automático no se usa en este proyecto.
[tool.ruff]
line-length = 110          # el ancho con el que ya está escrito el código
target-version = "py310"   # el mínimo que promete `requires-python`

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# Escribimos en español: el guion corto de los rangos («0–100», «1–4 casos») es el correcto y no
# un descuido de teclado. Sin esto, RUF002 pide cambiarlo por un guion normal en cada docstring.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
# En una prueba, leer un archivo de unos kilobytes dentro de una función asíncrona no bloquea a
# nadie: no hay usuarios esperando ni un bucle de eventos compartido.
"tests/**" = ["ASYNC240"]

# Tipos en modo estricto, la misma vara que el backend de Foundry. Se comprueba el paquete que se
# publica, no las pruebas (que pasan dobles donde va un `Context` a propósito). `python_version` es
# el mínimo que promete `requires-python`: lo que pase aquí no puede usar nada más nuevo.
[tool.mypy]
python_version = "3.10"
strict = true
packages = ["foundry_mcp"]
